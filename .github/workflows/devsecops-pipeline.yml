# Penpot DevSecOps pipeline
#
# Runs entirely on a SELF-HOSTED runner installed on the Ubuntu VM, so the
# deployment target and all scans execute locally (nothing is deployed to cloud).
# The same file runs unchanged on self-hosted Gitea Actions if a fully local
# control plane is required.
#
# Gating philosophy (see README): the pipeline blocks the deploy only on issues
# that are inside our control and that we can keep green (leaked secrets in our
# commits, misconfiguration in our own deploy files, and post-deploy hardening
# that did not actually apply). Findings in Penpot's upstream code and in the
# published base images are always scanned, reported, and pushed to developers,
# but they do not block our deployment because we cannot patch upstream from
# this pipeline.

name: Penpot DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly Mon 03:00 - re-scan pinned deps/images for new CVEs

permissions:
  contents: read
  issues: write # notify.sh opens/updates a tracking issue

env:
  PENPOT_VERSION: "2.10.1" # pinned; bump deliberately (see maintenance guide)
  PENPOT_HOST: "localhost" # hostname the stack is served on for the runner
  TRIVY_SEVERITY: "HIGH,CRITICAL"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Secret scanning  (GATING) - our repo must never contain real credentials
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - name: Prepare reports dir
        run: mkdir -p reports && chmod -R 777 reports
      - name: gitleaks - hardcoded secrets, keys, tokens
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo \
            --config=/repo/security/gitleaks/.gitleaks.toml \
            --report-format sarif --report-path /repo/reports/gitleaks.sarif \
            --redact --exit-code 1 || echo "FOUND=1" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/gitleaks.sarif
      - name: Notify + fail on leaked secret
        if: env.FOUND == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "gitleaks detected a hardcoded secret in the repository." > note.md
          bash scripts/notify.sh "Secret detected in repository" note.md
          echo "::error::Hardcoded secret detected - see gitleaks-report artifact"
          exit 1

  # ---------------------------------------------------------------------------
  # 2. SAST  (REPORT + NOTIFY) - Semgrep on app code, clj-kondo on Clojure
  # ---------------------------------------------------------------------------
  sast:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reports dir
        run: mkdir -p reports && chmod -R 777 reports
      - name: Semgrep - security audit + secrets + JS/Node + Dockerfile rules
        id: semgrep
        run: |
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src semgrep/semgrep:latest \
              semgrep scan --error --sarif -o reports/semgrep.sarif \
              --config p/security-audit --config p/secrets \
              --config p/javascript --config p/nodejs --config p/dockerfile \
              frontend exporter common backend; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "findings=true" >> "$GITHUB_OUTPUT"
          fi
      - name: clj-kondo - Clojure static analysis
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src cljkondo/clj-kondo:latest \
            clj-kondo --lint backend/src common/src \
            > reports/clj-kondo.txt 2>&1 || true
      - name: Clean up Docker-created files
        if: always()
        run: |
          # Safety net: remove any cache dirs Docker containers may have created
          # as a different user, so future checkouts are not blocked.
          sudo rm -rf .clj-kondo/.cache .semgrep/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: reports/
      - name: Notify developers of SAST findings
        if: steps.semgrep.outputs.findings == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Semgrep reported static-analysis findings. See the sast-reports artifact (semgrep.sarif)." > note.md
          bash scripts/notify.sh "SAST findings in Penpot codebase" note.md

  # ---------------------------------------------------------------------------
  # 3. Dependency + container scanning  (REPORT + NOTIFY)
  # ---------------------------------------------------------------------------
  sca:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reports dir
        run: mkdir -p reports && chmod -R 777 reports
      - name: Trivy - filesystem (dependencies + secrets in repo)
        id: trivyfs
        run: |
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v trivy-cache:/root/.cache \
              aquasec/trivy:latest fs /src \
              --scanners vuln,secret --severity "$TRIVY_SEVERITY" \
              --exit-code 1 --format sarif -o /src/reports/trivy-fs.sarif; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "findings=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy - Penpot container images
        id: trivyimg
        run: |
          found=false
          for img in penpotapp/frontend penpotapp/backend penpotapp/exporter; do
            docker pull "$img:${PENPOT_VERSION}"
            docker run --rm --user "$(id -u):$(id -g)" -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/src" -v trivy-cache:/root/.cache aquasec/trivy:latest \
              image "$img:${PENPOT_VERSION}" --severity "$TRIVY_SEVERITY" \
              --ignorefile /src/security/trivy/.trivyignore --exit-code 1 \
              --format json -o "/src/reports/trivy-$(basename "$img").json" || found=true
          done
          echo "findings=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: reports/
      - name: Notify developers of dependency/image vulnerabilities
        if: steps.trivyfs.outputs.findings == 'true' || steps.trivyimg.outputs.findings == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Trivy reported HIGH/CRITICAL vulnerabilities in dependencies or images. See the sca-reports artifact." > note.md
          bash scripts/notify.sh "Dependency/image vulnerabilities detected" note.md

  # ---------------------------------------------------------------------------
  # 4. IaC / deploy config hardening  (GATING) - our own compose + nginx
  # ---------------------------------------------------------------------------
  iac-hardening:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reports dir
        run: mkdir -p reports && chmod -R 777 reports
      - name: Trivy - misconfiguration scan of deploy/ (our files only)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v trivy-cache:/root/.cache \
            aquasec/trivy:latest config /src/deploy \
            --severity "$TRIVY_SEVERITY" --exit-code 1 \
            --format sarif -o /src/reports/trivy-config.sarif \
            || echo "FOUND=1" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-report
          path: reports/trivy-config.sarif
      - name: Notify + fail on deploy misconfiguration
        if: env.FOUND == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Trivy found HIGH/CRITICAL misconfiguration in our deploy/ files." > note.md
          bash scripts/notify.sh "Deployment misconfiguration detected" note.md
          echo "::error::Deploy config failed hardening scan - see iac-report artifact"
          exit 1

  # ---------------------------------------------------------------------------
  # 5. Secure deployment  - only after gating scans pass
  # ---------------------------------------------------------------------------
  deploy:
    needs: [secret-scan, iac-hardening]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy hardened Penpot stack
        env:
          PENPOT_PUBLIC_URI: "https://${{ env.PENPOT_HOST }}"
          PENPOT_SECRET_KEY: ${{ secrets.PENPOT_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: bash scripts/deploy.sh
      - name: Notify on deploy failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Secure deployment failed on $(hostname)." > note.md
          bash scripts/notify.sh "Secure deployment failed" note.md

  # ---------------------------------------------------------------------------
  # 6. Post-deploy validation  (GATING on audit + health; DAST reports)
  # ---------------------------------------------------------------------------
  validate:
    needs: [deploy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reports dir
        run: mkdir -p reports && chmod -R 777 reports
      - name: Configuration audit - was the hardening actually applied?
        run: bash scripts/config-audit.sh | tee reports/config-audit.txt
      - name: Service availability & integrity
        run: bash scripts/health-check.sh | tee reports/health-check.txt
      - name: DAST baseline - OWASP ZAP (report only)
        run: bash scripts/dast-scan.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: reports/
      - name: Notify on validation failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bash scripts/notify.sh "Post-deploy validation failed" reports/config-audit.txt

  # ---------------------------------------------------------------------------
  # 7. Consolidated summary report  (always runs, even on earlier failures)
  # ---------------------------------------------------------------------------
  summary-report:
    if: always()
    needs: [secret-scan, sast, sca, iac-hardening, deploy, validate]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare collection dir
        run: mkdir -p collected-reports
      - uses: actions/download-artifact@v4
        with:
          path: collected-reports
          merge-multiple: false
      - name: Generate consolidated summary
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          IAC_RESULT: ${{ needs.iac-hardening.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: bash scripts/generate-summary.sh collected-reports
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: collected-reports/pipeline-summary.md
      - name: Post summary to tracking issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/notify.sh "Pipeline run summary" collected-reports/pipeline-summary.md

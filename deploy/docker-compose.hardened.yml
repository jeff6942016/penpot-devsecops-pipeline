# Hardened Penpot deployment.
#
# Security posture vs. the stock Penpot compose file:
#   - TLS-terminating nginx reverse proxy in front; Penpot is never published directly.
#   - HTTP -> HTTPS redirect and security headers set at the proxy.
#   - PostgreSQL and Redis have NO published ports; they live on an internal
#     network with no route off-host. Redis additionally requires a password
#     (closes the "unauthenticated Redis" finding).
#   - Backend flags remove the Clojure PREPL server (a remote-eval surface) and
#     do NOT disable secure session cookies, so cookies are marked Secure.
#   - No hardcoded secrets: every credential is injected from the CI secret store
#     (or a local .env that is never committed).
#   - no-new-privileges, all Linux capabilities dropped by default, per-service
#     health checks, log rotation, and pinned image versions.
#
# Secrets come from the generated .env (see scripts/deploy.sh). Never commit .env.

name: penpot-hardened

networks:
  edge: # proxy <-> frontend
  internal: # backend <-> postgres/redis, isolated from the outside world
    internal: true

volumes:
  penpot_postgres:
  penpot_assets:

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  proxy:
    image: nginx:1.27-alpine
    <<: *hardening
    depends_on:
      - penpot-frontend
    ports:
      - "80:80" # redirect only
      - "443:443"
    volumes:
      - ./nginx/penpot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION}"
    <<: *hardening
    depends_on:
      - penpot-backend
      - penpot-exporter
    volumes:
      - penpot_assets:/opt/data/assets
    networks:
      - edge
      - internal
    environment:
      PENPOT_FLAGS: "${PENPOT_FRONTEND_FLAGS}"
    # No published ports: only reachable through the proxy.

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION}"
    <<: *hardening
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-redis:
        condition: service_healthy
    volumes:
      - penpot_assets:/opt/data/assets
    networks:
      - internal
    environment:
      PENPOT_FLAGS: "${PENPOT_BACKEND_FLAGS}"
      PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY}"
      PENPOT_PUBLIC_URI: "${PENPOT_PUBLIC_URI}"
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_DATABASE_URI: "postgresql://penpot-postgres/${POSTGRES_DB}"
      PENPOT_DATABASE_USERNAME: "${POSTGRES_USER}"
      PENPOT_DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      PENPOT_REDIS_URI: "redis://:${REDIS_PASSWORD}@penpot-redis/0"

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION}"
    <<: *hardening
    depends_on:
      - penpot-redis
    networks:
      - internal
    environment:
      PENPOT_PUBLIC_URI: "http://penpot-frontend:8080"
      PENPOT_REDIS_URI: "redis://:${REDIS_PASSWORD}@penpot-redis/0"

  penpot-postgres:
    image: "postgres:15"
    <<: *hardening
    cap_add: # minimum caps Postgres needs after cap_drop ALL
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    stop_signal: SIGINT
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - penpot_postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports.

  penpot-redis:
    image: "redis:7-alpine"
    <<: *hardening
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}",
        "--save", "",
        "--appendonly", "no",
      ]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports.
